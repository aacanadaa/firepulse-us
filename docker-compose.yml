services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: firepulse
      POSTGRES_PASSWORD: firepulse
      POSTGRES_DB: firepulse
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/seed/dev_seed.sql:/docker-entrypoint-initdb.d/009_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firepulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        SPREAD_ASSETS_URL: ${SPREAD_ASSETS_URL:-}
    environment:
      PORT: 8790
      SPREAD_USER_AGENT: ${SPREAD_USER_AGENT:-}
      FIREPULSE_USER_AGENT: ${FIREPULSE_USER_AGENT:-}
      DATA_MODE: ${DATA_MODE:-live}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:-}
      DATABASE_URL: postgres://firepulse:firepulse@db:5432/firepulse
      AIRNOW_API_KEY: ${AIRNOW_API_KEY:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OPS_WEBHOOK_URL: ${OPS_WEBHOOK_URL:-}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "*"
    ports: ["8790:8790"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  goes-worker:
    build:
      context: apps/goes-worker
    environment:
      FIREPULSE_API_URL: http://api:8790
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:-}
      FIREPULSE_USER_AGENT: ${FIREPULSE_USER_AGENT:-}
    depends_on: [api]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8790
        API_INTERNAL_URL: http://api:8790
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
