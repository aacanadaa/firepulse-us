services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: firepulse
      POSTGRES_PASSWORD: firepulse
      POSTGRES_DB: firepulse
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/seed/dev_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firepulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        SPREAD_ASSETS_URL: ${SPREAD_ASSETS_URL:-}
    environment:
      PORT: 8790
      SPREAD_USER_AGENT: ${SPREAD_USER_AGENT:-}
      DATA_MODE: simulation
      DATABASE_URL: postgres://firepulse:firepulse@db:5432/firepulse
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "*"
    ports: ["8790:8790"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8790
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
