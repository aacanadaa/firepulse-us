name: API health check

# The API runs on a GCE VM (deploy/gce), which never sleeps, so this is now a
# plain health check: a failed run means the API is down.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS -m 90 -o /tmp/health.json -w '%{http_code}' \
              https://136-80-212-110.sslip.io/api/health || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              python3 -c "import json; d=json.load(open('/tmp/health.json')); print('ok:', d.get('ok'), '| store:', d.get('store'), '| feeds down:', [s['id'] for s in d.get('sources', []) if s.get('status') not in ('ok','pending')])"
              exit 0
            fi
            sleep 30
          done
          echo "API did not answer 200 after three attempts" >&2
          exit 1
